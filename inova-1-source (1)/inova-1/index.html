<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inova 1</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="logo">I</span> Inova <b>1</b></div><span class="tag">NAVEGADOR INTEGRADO</span></header>
<main>
<div class="toolbar">
<button id="back" title="Atrás">‹</button><button id="forward" title="Adelante">›</button>
<button id="reload" title="Recargar">↻</button><button id="home" title="Inicio">⌂</button>
<form id="address-form"><span>⌕</span><input id="address" placeholder="Escribe una dirección o busca en la web" autocomplete="url">
<button class="go" type="submit">Ir</button></form><button id="new-tab" title="Nueva pestaña">＋</button>
</div>
<div id="tabs" class="tabs"></div>
<section id="view-wrap">
<div id="welcome">
<div class="big-logo">I</div><p class="eyebrow">TU ESPACIO DIGITAL</p>
<h1>Bienvenido a <em>Inova 1</em></h1><p>Navega desde la misma ventana, sin abrir otro navegador aparte.</p>
<form id="search-form"><input id="search" placeholder="Buscar en la web o escribir una dirección"><button class="go">Buscar</button></form>
<div class="links"><button data-url="https://www.google.com">Google</button><button data-url="https://www.wikipedia.org">Wikipedia</button>
<button data-url="https://www.youtube.com">YouTube</button><button data-url="https://www.roblox.com">Roblox</button></div>
<small>Escribe una dirección web o una búsqueda en la barra superior.</small>
</div></section><footer><span id="status">Listo</span><span>INOVA 1 · VERSIÓN 1.0</span></footer>
</main><script src="renderer.js"></script></body></html>
